name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Job name must stay "test" — branch protection requires that check by name.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
