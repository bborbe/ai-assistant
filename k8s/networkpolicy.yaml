# Firewall rules for the Star Citizen assistant (shim + bot).
#
# Default-deny in BOTH directions. Every rule below names its source (pod
# selector, or a specific CIDR) together with its port. There is no all-ports
# rule and no port-less rule in either direction: a rule without a `ports:`
# block admits every port, which is the shape this file exists to avoid.
#
# Applies to both pods via the shared label sc.assistant="true" (set on the bot
# and shim pod templates — one identity, one policy).
#
# ── Callers and destinations, as measured 2026-10-28 ────────────────────────
#
# Egress (what the pods dial):
#   * kube-dns:53             — DNS for both containers. Without it every lookup
#                               times out and reads as a policy denial.
#   * Discord:443             — the bot's gateway/API and the shim's chat-bridge
#                               POST. Measured: every Discord host
#                               (discord.com, gateway.discord.gg,
#                               cdn.discordapp.com, discordapp.com) resolved
#                               into 162.159.0.0/16 and nothing else.
#   * github.com:22,443       — vault-sync clones/pulls the vault over git SSH.
#   * claude-shim:8080        — the bot's OPENAI_BASE_URL
#                               (http://claude-shim:8080/v1), same namespace.
#   * claude-code-router:8788 — the shim's ANTHROPIC_BASE_URL (model access).
#
# Ingress (who reaches the pods):
#   * Traefik:8080            — the claude-shim Ingress (claude-shim-ing.yaml),
#                               in both environments.
#   * bot:8080                — bot -> shim, same namespace.
#
# ── Notes that are load-bearing ─────────────────────────────────────────────
#
# * The router lives in the `agent` namespace on BOTH clusters
#   (claude-code-router-dev / -prod), not in `dev` / `prod` as it did when this
#   file was written. A literal namespace is used deliberately: it is identical
#   in both environments, so a literal cannot silently diverge the way an
#   env-substituted value can.
# * Traefik IS selectable by label (app.kubernetes.io/name=traefik), so the
#   ingress rule is scoped to its pods rather than to the whole kube-system
#   namespace. This file previously claimed no such label existed; that was
#   wrong.
# * namespaceSelector and podSelector sit in the SAME peer entry on every
#   cross-namespace rule. Split into two peers they OR and open the whole
#   namespace.
# * No rule admits the node CIDR or 10.0.0.0/8 for health probes. Kubelet
#   probes are not policy-evaluated here: the pods reported Ready for weeks
#   with no rule admitting the node address, so no probe rule is needed.
#   Adding one would re-open the cluster-wide ingress this file exists to
#   close.
# * Discord publishes no CIDR list, so 162.159.0.0/16 is a measurement, not a
#   contract. If the bot ever fails to reach the gateway, re-run the four
#   lookups above and widen only to the ranges that answer; do not restore the
#   three Cloudflare-wide ranges (104.16.0.0/13, 172.64.0.0/13,
#   138.199.0.0/16) — none of them matched any Discord host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sc-assistant
  namespace: star-citizen
spec:
  podSelector:
    matchLabels:
      sc.assistant: 'true'
  policyTypes: [Egress, Ingress]
  egress:
    # DNS (CoreDNS in kube-system)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Discord gateway + API (HTTPS). Measured range — see the header note.
    - to:
        - ipBlock: { cidr: 162.159.0.0/16 }
      ports:
        - { protocol: TCP, port: 443 }
    # Vault repo (git-over-SSH to github.com) — vault-clone init + vault-sync
    # sidecar pull/push. github.com + ssh.github.com resolve inside this range.
    - to:
        - ipBlock: { cidr: 140.82.112.0/20 }
      ports:
        - { protocol: TCP, port: 22 }
        - { protocol: TCP, port: 443 }
    # Same namespace: bot -> shim (claude-shim:8080). Named destination and
    # port — previously a bare podSelector{} that admitted every port.
    - to:
        - podSelector:
            matchLabels: { app: discord-assistant-shim }
      ports:
        - { protocol: TCP, port: 8080 }
    # Sanctioned cross-namespace egress: shared Claude router (model access),
    # in the `agent` namespace on both clusters.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: agent }
          podSelector:
            matchLabels: { app.kubernetes.io/name: claude-code-router }
      ports:
        - { protocol: TCP, port: 8788 }
  ingress:
    # Traefik, so the claude-shim Ingress can reach the shim on 8080. Scoped to
    # Traefik's own pods, not the whole kube-system namespace.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
    # Same namespace: bot -> shim.
    - from:
        - podSelector:
            matchLabels: { app: discord-assistant }
      ports:
        - { protocol: TCP, port: 8080 }
