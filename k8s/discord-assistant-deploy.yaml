apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-assistant
  namespace: '{{"NAMESPACE" | env}}'
spec:
  # HELD AT 0 — deliberately not running.
  #
  # A Discord bot identity permits ONE gateway connection. This deployment shares
  # its Discord application (Star Citizen Assistant, id 1536456376258404452) with
  # the laptop instance, which is the one that has voice (`VOICE_ENABLED=1`). With
  # both live, Discord delivers every interaction to both gateway sessions: this
  # pod runs text-only, so it answers the voice subcommands with
  # VOICE_DISABLED_REPLY and wins the acknowledgement race, and the laptop
  # instance then dies on an uncaught `DiscordAPIError[10062] Unknown interaction`
  # — observed 2026-10-03, twice inside one minute, each killing the process and
  # restarting it under launchd. The two also overwrite each other's guild
  # registration, since registrations are per-application: the live `/sc` flaps
  # between this pod's 5 subcommands and the laptop's 11, last writer wins.
  #
  # The laptop instance is the intended one while voice is the goal. Raise this
  # back to 1 only once this pod is the sole holder of the identity, or once it
  # has been given its own Discord application.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discord-assistant
  template:
    metadata:
      labels:
        app: discord-assistant
        sc.assistant: 'true'
    spec:
      serviceAccountName: sc-assistant
      # No imagePullSecrets on purpose: the nuke registry
      # (docker.prod.nuke.benjamin-borbe.de:443) serves anonymous pulls, and
      # no `docker` secret exists in any namespace — the fleet's other
      # deployments reference one that is absent. Verified 2026-08-31: pulls
      # succeed in star-citizen with none configured.
      # Image USER is non-numeric (node) — runAsNonRoot can't verify it without
      # an explicit numeric runAsUser. node's uid/gid is 1000.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: bot
          image: '{{"DOCKER_REGISTRY" | env}}/bborbe/discord-assistant:{{"BRANCH" | env}}'
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef: { name: discord-assistant, key: DISCORD_TOKEN }
            - name: ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef: { name: discord-assistant, key: ALLOWED_USER_IDS }
            - name: ADMIN_USER_IDS
              valueFrom:
                secretKeyRef: { name: discord-assistant, key: ADMIN_USER_IDS }
            # The shim's control-plane token. Since the authenticated control
            # plane shipped, every mutating shim route requires it, and the check
            # is fail-closed: absent or mismatched, the route refuses rather than
            # degrading. Read by BOTH sides under this SAME name — src/config.js
            # and claude_openai_shim.py — so a value present on one side only
            # looks like "the feature does nothing", not like a config error.
            - name: CHAT_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef: { name: discord-assistant, key: CHAT_BRIDGE_TOKEN }
            - name: IDENTITY
              value: sc
            - name: OPENAI_BASE_URL
              value: http://claude-shim:8080/v1
            # Text-only baseline in the cluster: no GPU on any node, speech
            # stays on the laptop. VOICE_ENABLED=0 omits join/leave from the
            # guild command list (see src/slash-commands.js).
            - name: VOICE_ENABLED
              value: '0'
            - name: LOG_LEVEL
              value: info
            # The Star Citizen assistant is the ONLY identity that groups its
            # commands under a prefix. `multi` (the default) registers a dozen
            # generic top-level names — /new, /status, /mode — that collide with
            # every other bot on the Liga server; `single` collapses them under
            # one `/sc` instead. Deliberately NOT set on the personal, boss or
            # brogrammers identities, which keep the default surface.
            # VOICE_ENABLED=0 above means all six voice commands (join, leave,
            # wakephrase, interrupt, transcribe, cancel) are omitted from the
            # subcommand list, so `/sc` carries the five text-surface commands:
            # status, new, sessions, switch, mode.
            - name: SLASH_COMMAND_MODE
              value: single
            - name: SLASH_COMMAND_NAME
              value: sc
          # Liveness must not depend on Discord: an outage there should drain,
          # not restart every pod into a reconnect storm.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          # Readiness tracks the gateway connection.
          readinessProbe:
            httpGet: { path: /readiness, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
      volumes:
        - name: tmp
          emptyDir: {}
