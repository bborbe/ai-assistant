# The discord-assistant Secret's ROUTER_API_KEY — the router x-api-key the shim
# sends as ANTHROPIC_API_KEY (secretKeyRef in discord-assistant-shim-deploy.yaml).
# Resolved at `make apply` time from TeamVault: the deploy env files hold only the
# lookup key (e.g. `export ROUTER_API_KEY=dqD4nq`), the template fetches the value
# from TeamVault and base64-encodes it for the Secret's data. The claude-code-router
# has no allowedApiKeys, so the value is not validated — this manifest exists so the
# Secret is reproducible in-repo instead of hand-applied.
#
# Other keys in the live Secret (DISCORD_TOKEN, VAULT_GIT_KEY, ADMIN_USER_IDS,
# ALLOWED_USER_IDS) are applied out-of-band and are untouched by this manifest —
# kubectl apply merges the data map, so unspecified keys are preserved.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: discord-assistant
  namespace: '{{ "NAMESPACE" | env }}'
data:
  ROUTER_API_KEY: '{{ "ROUTER_API_KEY" | env | teamvaultPassword | base64 }}'
